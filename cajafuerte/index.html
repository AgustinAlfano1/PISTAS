<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caja Fuerte Digital</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle,#444,#111);
  font-family:Arial, sans-serif;
  overflow:hidden;
}

.safe{
  background:#555;
  padding:22px;
  border-radius:14px;
  box-shadow:0 12px 30px rgba(0,0,0,.8);
  width:340px;
  position:relative;
}

.display{
  background:#050;
  color:#0f0;
  font-size:18px;
  padding:12px;
  border-radius:6px;
  min-height:52px;
  margin-bottom:15px;
  box-shadow:inset 0 0 8px #0f0;
  word-wrap:break-word;
}

.keypad{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

button{
  font-size:20px;
  padding:14px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.4);
}

.num{ background:#777; color:white; }
.action{ background:#b03a2e; color:white; }
.confirm{ background:#1e8449; color:white; }

button:active{
  transform:translateY(2px);
}

.overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.9);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  color:white;
  z-index:10;
}

.overlay h2{
  margin-bottom:15px;
}

.retry{
  padding:12px 20px;
  font-size:18px;
  background:#1e8449;
  border:none;
  border-radius:8px;
  color:white;
  cursor:pointer;
}

.explosion{
  position:fixed;
  width:12px;
  height:12px;
  background:orange;
  border-radius:50%;
  animation:explode 1s forwards;
}

@keyframes explode{
  to{
    transform:translate(var(--x),var(--y)) scale(0);
    opacity:0;
  }
}

.confetti{
  position:fixed;
  width:8px;
  height:8px;
  background:red;
  top:-10px;
  animation:fall linear infinite;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(360deg);
  }
}
</style>
</head>

<body>

<div class="safe">
  <div class="display" id="display"></div>

  <div class="keypad">
    <button class="num" onclick="addDigit(7)">7</button>
    <button class="num" onclick="addDigit(8)">8</button>
    <button class="num" onclick="addDigit(9)">9</button>

    <button class="num" onclick="addDigit(4)">4</button>
    <button class="num" onclick="addDigit(5)">5</button>
    <button class="num" onclick="addDigit(6)">6</button>

    <button class="num" onclick="addDigit(1)">1</button>
    <button class="num" onclick="addDigit(2)">2</button>
    <button class="num" onclick="addDigit(3)">3</button>

    <button class="action" onclick="clearCurrent()">⌫</button>
    <button class="num" onclick="addDigit(0)">0</button>
    <button class="confirm" onclick="confirmNumber()">✔</button>
  </div>

  <div class="overlay" id="failScreen">
    <h2>💥 CÓDIGO INCORRECTO 💥</h2>
    <button class="retry" onclick="resetGame()">Reintentar</button>
  </div>

  <div class="overlay" id="successScreen">
    <h2 id="finalText"></h2>
  </div>
</div>

<script>
const code=[47,13,13,18,33,4,24,26,71,12,7,28,102,8,16,22,92];
let current="",entered=[],locked=false;

const display=document.getElementById("display");
const failScreen=document.getElementById("failScreen");
const successScreen=document.getElementById("successScreen");
const finalText=document.getElementById("finalText");

const beep=new Audio("beep-401570.mp3");
const errorSound=new Audio("https://assets.mixkit.co/sfx/preview/mixkit-explosion-impact-1705.mp3");
const openSound=new Audio("https://assets.mixkit.co/sfx/preview/mixkit-unlock-game-notification-253.mp3");

function playSound(sound){
  sound.currentTime=0;
  sound.play().catch(()=>{});
}

function updateDisplay(){
  display.textContent=entered.join(" - ")+(current?(entered.length?" - ":"")+current:"");
}

function addDigit(d){
  if(locked) return;
  playSound(beep);
  current+=d;
  updateDisplay();
}

function clearCurrent(){
  if(locked) return;
  current="";
  updateDisplay();
}

function confirmNumber(){
  if(locked||current==="") return;
  entered.push(Number(current));
  current="";
  updateDisplay();

  if(entered.length===code.length){
    JSON.stringify(entered)===JSON.stringify(code)
      ? unlock()
      : explode();
  }
}

function explode(){
  locked=true;
  playSound(errorSound);
  for(let i=0;i<60;i++){
    const e=document.createElement("div");
    e.className="explosion";
    e.style.left="50vw";
    e.style.top="50vh";
    e.style.setProperty("--x",(Math.random()*400-200)+"px");
    e.style.setProperty("--y",(Math.random()*400-200)+"px");
    document.body.appendChild(e);
    setTimeout(()=>e.remove(),1000);
  }
  setTimeout(()=>failScreen.style.display="flex",600);
}

function resetGame(){
  entered=[];
  current="";
  locked=false;
  updateDisplay();
  failScreen.style.display="none";
}

function unlock(){
  locked=true;
  playSound(openSound);
  launchConfetti();
  successScreen.style.display="flex";
  let text="SOY DE ZONA OESTE";
  let i=0;
  const interval=setInterval(()=>{
    finalText.textContent+=text[i];
    i++;
    if(i>=text.length) clearInterval(interval);
  },90);
}

function launchConfetti(){
  for(let i=0;i<120;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=`hsl(${Math.random()*360},80%,60%)`;
    c.style.animationDuration=2+Math.random()*3+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),5000);
  }
}

document.addEventListener("keydown",e=>{
  if(e.key>="0"&&e.key<="9") addDigit(e.key);
  if(e.key==="Backspace") clearCurrent();
  if(e.key==="Enter") confirmNumber();
});
</script>

</body>
</html>
