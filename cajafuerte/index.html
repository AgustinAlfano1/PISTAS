<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caja Fuerte Digital</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#2b2b2b;
  font-family:Arial, sans-serif;
}

.safe{
  background:#444;
  padding:20px;
  border-radius:12px;
  box-shadow:0 10px 25px rgba(0,0,0,.6);
  width:320px;
}

.display{
  background:#111;
  color:#0f0;
  font-size:18px;
  padding:10px;
  border-radius:6px;
  min-height:48px;
  margin-bottom:15px;
  word-wrap:break-word;
}

.keypad{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

button{
  font-size:20px;
  padding:14px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.num{
  background:#777;
  color:white;
}

.action{
  background:#c0392b;
  color:white;
}

.confirm{
  background:#27ae60;
  color:white;
}

.message{
  margin-top:15px;
  text-align:center;
  font-size:18px;
  font-weight:bold;
  color:#0f0;
  display:none;
}
</style>
</head>

<body>

<div class="safe">
  <div class="display" id="display"></div>

  <div class="keypad">
    <button class="num" onclick="add('7')">7</button>
    <button class="num" onclick="add('8')">8</button>
    <button class="num" onclick="add('9')">9</button>

    <button class="num" onclick="add('4')">4</button>
    <button class="num" onclick="add('5')">5</button>
    <button class="num" onclick="add('6')">6</button>

    <button class="num" onclick="add('1')">1</button>
    <button class="num" onclick="add('2')">2</button>
    <button class="num" onclick="add('3')">3</button>

    <button class="action" onclick="clearEntry()">⌫</button>
    <button class="num" onclick="add('0')">0</button>
    <button class="confirm" onclick="confirm()">✔</button>
  </div>

  <div class="message" id="message">SOY DE ZONA OESTE</div>
</div>

<script>
const code = [
  47,13,13,18,33,4,24,26,71,12,7,28,102,8,16,22,92
];

let current = "";
let entered = [];

const display = document.getElementById("display");
const message = document.getElementById("message");

function add(n){
  current += n;
  updateDisplay();
}

function clearEntry(){
  current = "";
  updateDisplay();
}

function updateDisplay(){
  display.textContent = entered.join(" - ") + (current ? (entered.length ? " - " : "") + current : "");
}

function confirm(){
  if(current==="") return;

  entered.push(Number(current));
  current = "";
  updateDisplay();

  if(entered.length === code.length){
    if(JSON.stringify(entered) === JSON.stringify(code)){
      unlock();
    }else{
      entered=[];
      updateDisplay();
      alert("Código incorrecto");
    }
  }
}

function unlock(){
  message.style.display="block";
}
</script>

</body>
</html>
