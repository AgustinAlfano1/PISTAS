<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caja Fuerte</title>

<style>
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#e0e0e0;
    font-family: Arial, sans-serif;
  }

  .safe-container{
    position: relative;
    width: 320px;
    height: 320px;
  }

  /* Flecha */
  .indicator{
    position:absolute;
    top:-18px;
    left:50%;
    transform:translateX(-50%);
    font-size:28px;
    z-index:5;
  }

  /* Rueda exterior */
  .dial-outer{
    width:100%;
    height:100%;
    border-radius:50%;
    background: radial-gradient(#f5f5f5, #bdbdbd);
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
  }

  /* Números exteriores */
  .number{
    position:absolute;
    font-size:16px;
    font-weight:bold;
    color:#222;
    transform-origin: 50% 140px;
  }

  /* Rueda interior */
  .dial-inner{
    width:180px;
    height:180px;
    border-radius:50%;
    background: radial-gradient(#dcdcdc, #9e9e9e);
    display:flex;
    justify-content:center;
    align-items:center;
    transition: transform 0.4s ease-out;
    box-shadow: inset 0 0 8px rgba(0,0,0,0.4);
  }

  .center{
    width:70px;
    height:70px;
    border-radius:50%;
    background:#888;
    box-shadow: inset 0 0 6px rgba(0,0,0,0.6);
  }

  .controls{
    margin-top:20px;
    display:flex;
    justify-content:center;
    gap:20px;
  }

  button{
    padding:10px 18px;
    font-size:18px;
    cursor:pointer;
  }

  .readout{
    text-align:center;
    margin-top:15px;
    font-size:18px;
    font-weight:bold;
  }
</style>
</head>

<body>

<div>
  <div class="safe-container">
    <div class="indicator">▲</div>

    <div class="dial-outer" id="dialOuter">
      <div class="dial-inner" id="dialInner">
        <div class="center"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button onclick="rotateDial(-1)">⬅</button>
    <button onclick="rotateDial(1)">➡</button>
  </div>

  <div class="readout">
    Número seleccionado: <span id="currentNumber">0</span>
  </div>
</div>

<script>
  const totalNumbers = 100;
  const stepDeg = 360 / totalNumbers;
  let current = 0;
  let rotation = 0;

  const dialInner = document.getElementById("dialInner");
  const readout = document.getElementById("currentNumber");

  /* Crear números exteriores */
  const outer = document.getElementById("dialOuter");
  for(let i=0;i<totalNumbers;i+=5){
    const n = document.createElement("div");
    n.className = "number";
    n.textContent = i;
    n.style.transform = `rotate(${i*stepDeg}deg) translateY(-140px) rotate(-${i*stepDeg}deg)`;
    outer.appendChild(n);
  }

  function rotateDial(dir){
    current = (current + dir + totalNumbers) % totalNumbers;
    rotation -= dir * stepDeg;
    dialInner.style.transform = `rotate(${rotation}deg)`;
    readout.textContent = current;
  }
</script>

</body>
</html>
