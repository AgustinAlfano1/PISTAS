<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caja Fuerte Digital</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle,#444,#111);
  font-family:Arial, sans-serif;
}

.safe{
  background:#555;
  padding:22px;
  border-radius:14px;
  box-shadow:0 12px 30px rgba(0,0,0,.8);
  width:340px;
  position:relative;
}

.display{
  background:#050;
  color:#0f0;
  font-size:18px;
  padding:12px;
  border-radius:6px;
  min-height:52px;
  margin-bottom:15px;
  box-shadow:inset 0 0 8px #0f0;
  word-wrap:break-word;
}

.keypad{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

button{
  font-size:20px;
  padding:14px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.4);
}

.num{ background:#777; color:white; }
.action{ background:#b03a2e; color:white; }
.confirm{ background:#1e8449; color:white; }

button:active{
  transform:translateY(2px);
}

.status{
  margin-top:12px;
  text-align:center;
  font-size:14px;
  color:#eee;
}

.message{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.85);
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  font-size:22px;
  color:#0f0;
  display:none;
  text-align:center;
}

.confetti{
  position:fixed;
  width:8px;
  height:8px;
  background:red;
  top:-10px;
  animation:fall linear infinite;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(360deg);
  }
}
</style>
</head>

<body>

<div class="safe">
  <div class="display" id="display"></div>

  <div class="keypad">
    <button class="num" onclick="addDigit(7)">7</button>
    <button class="num" onclick="addDigit(8)">8</button>
    <button class="num" onclick="addDigit(9)">9</button>

    <button class="num" onclick="addDigit(4)">4</button>
    <button class="num" onclick="addDigit(5)">5</button>
    <button class="num" onclick="addDigit(6)">6</button>

    <button class="num" onclick="addDigit(1)">1</button>
    <button class="num" onclick="addDigit(2)">2</button>
    <button class="num" onclick="addDigit(3)">3</button>

    <button class="action" onclick="clearCurrent()">⌫</button>
    <button class="num" onclick="addDigit(0)">0</button>
    <button class="confirm" onclick="confirmNumber()">✔</button>
  </div>

  <div class="status" id="status">Intentos restantes: 3</div>

  <div class="message" id="message">
    <div id="finalText"></div>
  </div>
</div>

<script>
const code=[47,13,13,18,33,4,24,26,71,12,7,28,102,8,16,22,92];
let current="",entered=[],tries=3,locked=false;

const display=document.getElementById("display");
const status=document.getElementById("status");
const message=document.getElementById("message");
const finalText=document.getElementById("finalText");

const beep=new Audio("https://assets.mixkit.co/sfx/preview/mixkit-select-click-1109.mp3");
const errorSound=new Audio("https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3");
const openSound=new Audio("https://assets.mixkit.co/sfx/preview/mixkit-unlock-game-notification-253.mp3");

function updateDisplay(){
  display.textContent=entered.join(" - ")+(current?(entered.length?" - ":"")+current:"");
}

function addDigit(d){
  if(locked) return;
  beep.play();
  current+=d;
  updateDisplay();
}

function clearCurrent(){
  if(locked) return;
  current="";
  updateDisplay();
}

function confirmNumber(){
  if(locked||current==="") return;
  entered.push(Number(current));
  current="";
  updateDisplay();

  if(entered.length===code.length){
    if(JSON.stringify(entered)===JSON.stringify(code)){
      unlock();
    }else{
      fail();
    }
  }
}

function fail(){
  errorSound.play();
  entered=[];
  tries--;
  status.textContent="Intentos restantes: "+tries;
  updateDisplay();

  if(tries<=0){
    locked=true;
    status.textContent="Bloqueado 10 segundos...";
    setTimeout(()=>{
      tries=3;
      locked=false;
      status.textContent="Intentos restantes: 3";
    },10000);
  }
}

function unlock(){
  openSound.play();
  launchConfetti();
  message.style.display="flex";
  let text="SOY DE ZONA OESTE";
  let i=0;
  const interval=setInterval(()=>{
    finalText.textContent+=text[i];
    i++;
    if(i>=text.length) clearInterval(interval);
  },80);
}

function launchConfetti(){
  for(let i=0;i<120;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=`hsl(${Math.random()*360},80%,60%)`;
    c.style.animationDuration=2+Math.random()*3+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),5000);
  }
}

document.addEventListener("keydown",e=>{
  if(e.key>="0"&&e.key<="9") addDigit(e.key);
  if(e.key==="Backspace") clearCurrent();
  if(e.key==="Enter") confirmNumber();
});
</script>

</body>
</html>
