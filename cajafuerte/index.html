<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caja Fuerte</title>

<style>
body{
  margin:0;
  background:#2e2e2e;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial, sans-serif;
  color:white;
}

.caja{
  text-align:center;
}

.flecha{
  font-size:32px;
  margin-bottom:10px;
}

.rueda-container{
  width:320px;
  height:320px;
  position:relative;
  margin:auto;
}

.rueda{
  width:100%;
  height:100%;
  border-radius:50%;
  background:radial-gradient(circle, #e0e0e0 0%, #a9a9a9 60%, #7a7a7a 100%);
  border:8px solid #444;
  position:absolute;
  transform:rotate(0deg);
  transition:transform 0.2s linear;
}

.numero{
  position:absolute;
  width:100%;
  height:100%;
  top:0;
  left:0;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  font-size:14px;
  font-weight:bold;
  color:#000;
}

.controls{
  margin-top:20px;
}

button{
  padding:10px 16px;
  font-size:16px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.info{
  margin-top:10px;
}
</style>
</head>

<body>

<div class="caja">
  <div class="flecha">▲</div>

  <div class="rueda-container">
    <div class="rueda" id="rueda"></div>
  </div>

  <div class="controls">
    <button onclick="girar(-1)">⟲ Izquierda</button>
    <button onclick="girar(1)">Derecha ⟳</button>
    <br><br>
    <button onclick="confirmar()">Confirmar número</button>
  </div>

  <div class="info" id="info"></div>
</div>

<script>
const rueda = document.getElementById("rueda");
const info = document.getElementById("info");

const totalNumeros = 103;
const gradosPorNumero = 360 / totalNumeros;

let rotacion = 0;
let actual = 0;
let ingresados = [];

const codigo = [
  47,13,13,18,33,4,24,26,71,12,7,28,102,8,16,22,92
];

// Dibujar números
for(let i=0;i<totalNumeros;i++){
  const n = document.createElement("div");
  n.className = "numero";
  n.style.transform = `rotate(${i*gradosPorNumero}deg)`;
  n.innerHTML = `<span style="margin-top:10px;">${i}</span>`;
  rueda.appendChild(n);
}

function girar(dir){
  rotacion += dir * gradosPorNumero;
  rueda.style.transform = `rotate(${rotacion}deg)`;
  actual = (actual - dir + totalNumeros) % totalNumeros;
}

function confirmar(){
  ingresados.push(actual);
  info.textContent = `Número ingresado: ${actual}`;

  if(ingresados.length === codigo.length){
    if(JSON.stringify(ingresados) === JSON.stringify(codigo)){
      info.textContent = "✔ Código correcto";
    }else{
      info.textContent = "✖ Código incorrecto";
    }
  }
}
</script>

</body>
</html>
