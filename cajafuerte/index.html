<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caja Fuerte</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#d9d9d9;
  font-family:Arial, sans-serif;
}

.safe{
  text-align:center;
}

.indicator{
  font-size:30px;
  margin-bottom:6px;
}

.dial-container{
  width:320px;
  height:320px;
  position:relative;
}

.dial-outer{
  width:100%;
  height:100%;
  border-radius:50%;
  background:radial-gradient(#f5f5f5,#bdbdbd);
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
}

.number{
  position:absolute;
  font-size:16px;
  font-weight:bold;
  color:#222;
  transform-origin:50% 150px;
}

.dial-inner{
  width:180px;
  height:180px;
  border-radius:50%;
  background:radial-gradient(#dcdcdc,#9e9e9e);
  box-shadow:inset 0 0 10px rgba(0,0,0,.4);
  position:absolute;
  cursor:grab;
}

.dial-inner:active{
  cursor:grabbing;
}

.center{
  width:70px;
  height:70px;
  background:#888;
  border-radius:50%;
  margin:auto;
  margin-top:55px;
  box-shadow:inset 0 0 6px rgba(0,0,0,.6);
}

.readout{
  margin-top:15px;
  font-size:18px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="safe">
  <div class="indicator">▲</div>

  <div class="dial-container">
    <div class="dial-outer" id="dialOuter">
      <div class="dial-inner" id="dialInner">
        <div class="center"></div>
      </div>
    </div>
  </div>

  <div class="readout">
    Número seleccionado: <span id="current">0</span>
  </div>
</div>

<script>
const total = 100;
const dialInner = document.getElementById("dialInner");
const currentEl = document.getElementById("current");
let rotation = 0;
let isDragging = false;
let startAngle = 0;

const rect = dialInner.getBoundingClientRect();
const centerX = rect.left + rect.width / 2;
const centerY = rect.top + rect.height / 2;

/* Números exteriores */
const outer = document.getElementById("dialOuter");
for(let i=0;i<total;i+=5){
  const n = document.createElement("div");
  n.className="number";
  n.textContent=i;
  const deg = i * (360/total);
  n.style.transform=`rotate(${deg}deg) translateY(-150px) rotate(-${deg}deg)`;
  outer.appendChild(n);
}

function getAngle(x,y){
  return Math.atan2(y-centerY,x-centerX) * 180 / Math.PI;
}

function updateNumber(){
  let normalized = ((rotation % 360) + 360) % 360;
  let num = Math.round((normalized / 360) * total);
  currentEl.textContent = num % total;
}

function startDrag(e){
  isDragging = true;
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  const y = e.touches ? e.touches[0].clientY : e.clientY;
  startAngle = getAngle(x,y) - rotation;
}

function drag(e){
  if(!isDragging) return;
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  const y = e.touches ? e.touches[0].clientY : e.clientY;
  rotation = getAngle(x,y) - startAngle;
  dialInner.style.transform = `rotate(${rotation}deg)`;
  updateNumber();
}

function stopDrag(){
  isDragging = false;
}

dialInner.addEventListener("mousedown",startDrag);
document.addEventListener("mousemove",drag);
document.addEventListener("mouseup",stopDrag);

dialInner.addEventListener("touchstart",startDrag);
document.addEventListener("touchmove",drag);
document.addEventListener("touchend",stopDrag);
</script>

</body>
</html>
